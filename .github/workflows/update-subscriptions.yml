name: Update subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: public-subscription-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout public repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: public
          fetch-depth: 20
          persist-credentials: false

      - name: Check whether a refresh is due
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run: a full refresh is due."
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_epoch="$(git -C public log -1 --format=%ct -- sub/summary.json || true)"
          if [[ -z "$last_epoch" ]]; then
            echo "No previous public summary commit: a full refresh is due."
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age_seconds="$(( $(date +%s) - last_epoch ))"
          echo "Last public subscription update is ${age_seconds}s old."
          if (( age_seconds >= 2700 )); then
            echo "The published build is at least 45 minutes old: refresh is due."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "The second half-hour watchdog found a fresh build; no duplicate work."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private builder
        if: steps.freshness.outputs.due == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: UIRAN23/free-vpn-builder
          ssh-key: ${{ secrets.PRIVATE_BUILDER_DEPLOY_KEY }}
          persist-credentials: false
          path: builder

      - name: Set up Python
        if: steps.freshness.outputs.due == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore Gemini region cache
        if: steps.freshness.outputs.due == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: builder/.cache/gemini-regions.json
          key: uran-gemini-regions-v1-${{ github.run_id }}
          restore-keys: |
            uran-gemini-regions-v1-

      - name: Install pinned runtime tools
        if: steps.freshness.outputs.due == 'true'
        working-directory: builder
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/download_tools.py

      - name: Build private subscriptions
        if: steps.freshness.outputs.due == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_MODEL: gemini-3.5-flash
          GEMINI_CACHE_PATH: ${{ github.workspace }}/builder/.cache/gemini-regions.json
          SKIP_TOOL_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/uran-private-build.log"
          if ! bash builder/scripts/run_publish.sh builder public >"$log_file" 2>&1; then
            echo "Private builder failed. Run the private diagnostic workflow for detailed logs."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("public/sub/summary.json").read_text(encoding="utf-8"))
          health = data.get("gemini_nodes", {}).get("health", {})
          print(
              "Published candidate: "
              f"nodes={data['mihomo_nodes']['all']}, "
              f"gemini={data['gemini_nodes']['all']}, "
              f"validation={data['validation']['ok']}"
          )
          if health:
              print(
                  "Gemini probe health: "
                  f"requests={health.get('requests')}, "
                  f"region_ok={health.get('region_ok')}, "
                  f"region_blocked={health.get('region_blocked')}, "
                  f"faults={health.get('faults')}, "
                  f"network_errors={health.get('network_errors')}, "
                  f"disabled={health.get('disabled')} {health.get('disabled_reason') or ''}"
              )
              print(f"Gemini status counts: {health.get('status_counts')}")
              print(f"Gemini top errors: {health.get('top_errors')}")
          PY

      - name: Commit public update
        if: steps.freshness.outputs.due == 'true'
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Vladimir"
          git config user.email "nemsasa29@gmail.com"
          git add -A sub
          if git diff --cached --quiet; then
            echo "No subscription changes."
            exit 0
          fi
          git commit -m "Update subscriptions"
          gh auth setup-git
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto the latest main."
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add -A sub
              git commit -m "Update subscriptions" || true
            fi
            sleep $((attempt * 5))
          done
          echo "Push still failing after 5 attempts."
          exit 1
